---
# Tasks for roles/webserver

- name: Install Python 3, venv, and build prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - libpq-dev
      - curl
      - git
    state: present

- name: Create application root directory /opt/hostel-app
  ansible.builtin.file:
    path: "{{ app_root_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy Flask application package from ../app/ to /opt/hostel-app/app
  ansible.builtin.copy:
    src: ../app/
    dest: "{{ app_root_dir }}/app/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy root application entrypoint app.py to /opt/hostel-app/app.py
  ansible.builtin.copy:
    src: ../app.py
    dest: "{{ app_root_dir }}/app.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Copy requirements.txt to /opt/hostel-app/requirements.txt
  ansible.builtin.copy:
    src: ../requirements.txt
    dest: "{{ app_root_dir }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Create Python virtual environment at /opt/hostel-app/venv
  ansible.builtin.command:
    cmd: python3 -m venv "{{ app_root_dir }}/venv"
    creates: "{{ app_root_dir }}/venv/bin/activate"
  become: yes
  become_user: "{{ app_user }}"

- name: Upgrade pip in the virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ app_root_dir }}/venv"
  become: yes
  become_user: "{{ app_user }}"

- name: Install Python application dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_root_dir }}/requirements.txt"
    virtualenv: "{{ app_root_dir }}/venv"
  become: yes
  become_user: "{{ app_user }}"
  notify: restart hostel-app

- name: Deploy systemd unit file /etc/systemd/system/hostel-app.service
  ansible.builtin.template:
    src: hostel-app.service.j2
    dest: /etc/systemd/system/hostel-app.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart hostel-app

- name: Allow Flask application port 5000 in UFW
  community.general.ufw:
    rule: allow
    port: "{{ app_port | string }}"
    proto: tcp
    comment: "Flask Application Ingress (Load Balancer & Direct)"

- name: Flush handlers to reload systemd and restart hostel-app service
  ansible.builtin.meta: flush_handlers

- name: Ensure hostel-app.service is enabled and running
  ansible.builtin.service:
    name: hostel-app
    state: started
    enabled: yes

- name: Verify local application telemetry health on http://127.0.0.1:5000/health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: app_health_probe
  retries: 6
  delay: 3
  until: app_health_probe.status == 200
