---
# Handlers for roles/monitoring
- name: restart nagios
  ansible.builtin.service:
    name: nagios4
    state: restarted

- name: reload nagios
  ansible.builtin.service:
    name: nagios4
    state: reloaded

- name: restart apache2
  ansible.builtin.service:
    name: apache2
    state: restarted
