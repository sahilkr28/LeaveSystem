---
# ==============================================================================
# Master Site Deployment Playbook - Smart Campus Hostel ERP
# Runs full infrastructure setup and application deployment across all 4 roles.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Base Hardening & Monitoring: Configure UFW and Nagios NRPE
# ------------------------------------------------------------------------------
- name: "Stage 1: Apply Common Hardening, UFW Rules, and Nagios NRPE Agent"
  hosts: loadbalancer:webservers:database
  become: yes
  gather_facts: yes
  roles:
    - role: common
      tags: [common, base, security, nrpe]

# ------------------------------------------------------------------------------
# 2. Database Provisioning: PostgreSQL on db-01
# ------------------------------------------------------------------------------
- name: "Stage 2: Provision PostgreSQL Database on db-01"
  hosts: database
  become: yes
  gather_facts: yes
  roles:
    - role: database
      tags: [database, postgres, db]

# ------------------------------------------------------------------------------
# 3. Webserver Provisioning: Deploy Flask Gunicorn on web-01 & web-02
# ------------------------------------------------------------------------------
- name: "Stage 3: Deploy Smart Hostel Flask Application on Web Nodes"
  hosts: webservers
  become: yes
  gather_facts: yes
  roles:
    - role: webserver
      tags: [webserver, flask, gunicorn, app]

# ------------------------------------------------------------------------------
# 4. Load Balancer Provisioning: Install and Configure HAProxy on lb-01
# ------------------------------------------------------------------------------
- name: "Stage 4: Configure HAProxy Load Balancer and Stats UI on lb-01"
  hosts: loadbalancer
  become: yes
  gather_facts: yes
  roles:
    - role: loadbalancer
      tags: [loadbalancer, haproxy, lb, stats]

# ------------------------------------------------------------------------------
# 5. Monitoring Provisioning: Configure Nagios Core & Self-Healing on ops-node
# ------------------------------------------------------------------------------
- name: "Stage 5: Provision Nagios Core Monitoring and Self-Healing on ops-node"
  hosts: ops
  become: yes
  gather_facts: yes
  roles:
    - role: monitoring
      tags: [monitoring, nagios, ops, selfheal]

# ------------------------------------------------------------------------------
# 6. Cluster Verification: End-to-End Health Probe
# ------------------------------------------------------------------------------
- name: "Stage 6: Verify Full Cluster Routing via HAProxy"
  hosts: loadbalancer
  become: yes
  gather_facts: no
  tasks:
    - name: Probe HAProxy HTTP endpoint on port 80
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ haproxy_port | default(80) }}/health"
        method: GET
        status_code: 200
      register: cluster_health_response
      retries: 5
      delay: 2
      until: cluster_health_response.status == 200

    - name: Display Cluster Health Telemetry Output
      ansible.builtin.debug:
        msg: >
          [SUCCESS] Smart Hostel Cluster is healthy!
          HAProxy routed to backend host: {{ cluster_health_response.json.host | default('N/A') }}
          Database status: {{ cluster_health_response.json.db | default('N/A') }}
          Overall status: {{ cluster_health_response.json.status | default('N/A') }}
