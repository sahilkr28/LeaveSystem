# Smart Campus Hostel DevOps Project - Default Inventory Template
# (Note: Automatically refreshed with live AWS IPs if terraform apply is executed)

[ops]
ops-node ansible_host=10.0.1.10 private_ip=10.0.1.10 ansible_user=ubuntu node_role=operations

[loadbalancer]
lb-01 ansible_host=10.0.1.20 private_ip=10.0.1.20 ansible_user=ubuntu node_role=loadbalancer

[webservers]
web-01 ansible_host=10.0.1.31 private_ip=10.0.1.31 ansible_user=ubuntu node_role=webserver node_id=1
web-02 ansible_host=10.0.1.32 private_ip=10.0.1.32 ansible_user=ubuntu node_role=webserver node_id=2

[database]
db-01 ansible_host=10.0.1.40 private_ip=10.0.1.40 ansible_user=ubuntu node_role=database

[cluster:children]
ops
loadbalancer
webservers
database

[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
